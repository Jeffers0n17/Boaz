<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXIA — Pagamento concluído</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center">
      <h1>✅ Pronto!</h1>
      <p class="subtitle" id="msg">Assinatura confirmada.</p>
      <a class="primary" style="display:block; padding:12px; border-radius:10px; text-decoration:none; background:var(--accent); color:#0b1020; font-weight:700;" href="/dashboard.html">Voltar ao dashboard</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('demo') === '1') {
      document.getElementById('msg').textContent = `Sessão demo (${params.get('session_id')}) concluída — nenhuma cobrança real foi feita.`;
    }
  </script>
</body>
</html>
