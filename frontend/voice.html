<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXIA — Modo de voz</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Layout específico da tela de voz em tela cheia — o resto do visual
       (cores, fontes) vem de styles.css pra manter a identidade do AXIA. */
    html, body { height: 100%; overflow: hidden; }
    body { background: #05070f; }

    #sphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .voice-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 32px 16px 40px;
      pointer-events: none;
      gap: 14px;
    }

    .voice-overlay > * { pointer-events: auto; }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      background: rgba(27,36,64,0.6);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .back-link:hover { color: var(--text); border-color: var(--accent); }

    .voice-status {
      color: var(--text-dim);
      font-size: 14px;
      letter-spacing: 0.5px;
      min-height: 18px;
    }

    .voice-transcript {
      max-width: 560px;
      text-align: center;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 24px;
      white-space: pre-wrap;
      background: rgba(5,7,15,0.72);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
    }
    .voice-transcript:empty { background: transparent; border-color: transparent; padding: 0; }

    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .mic-btn:hover { transform: scale(1.05); border-color: var(--accent); }
    .mic-btn.listening {
      border-color: var(--accent);
      box-shadow: 0 0 0 8px rgba(108,140,255,0.15), 0 10px 40px rgba(0,0,0,0.5);
    }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .text-fallback {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }
    .text-fallback input {
      flex: 1;
      background: rgba(27,36,64,0.7);
    }
    .text-fallback button {
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
    }
    .text-fallback button:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="sphere-canvas"></canvas>

  <a class="back-link" href="/dashboard.html">← Dashboard</a>

  <div class="voice-overlay">
    <div class="voice-transcript" id="transcript"></div>
    <div class="voice-status" id="status">Pronto</div>
    <button id="mic-btn" class="mic-btn" title="Falar com o AXIA">🎤</button>
    <form id="text-fallback-form" class="text-fallback">
      <input id="text-fallback-input" type="text" placeholder="Ou digite aqui (sem microfone)…" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="/app.js"></script>
  <script type="module" src="/voice.js"></script>
</body>
</html>
