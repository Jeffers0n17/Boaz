services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: axia-app
    container_name: axia-app
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    environment:
      - PORT=8080
    volumes:
      - axia_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  axia_data:
